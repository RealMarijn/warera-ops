<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WarEra Damage lines</title>
    <style>
      body { width: 240px; margin: 0; font-family: system-ui, sans-serif; background: #14161c; color: #e8e8ea; }
      .wrap { padding: 14px; }
      h1 { font-size: 14px; margin: 0 0 2px; }
      p { font-size: 11px; opacity: .65; margin: 0 0 12px; line-height: 1.4; }
      .row { display: flex; align-items: center; justify-content: space-between; }
      .row span { font-size: 13px; }
      .switch { position: relative; width: 42px; height: 24px; }
      .switch input { opacity: 0; width: 0; height: 0; }
      .slider { position: absolute; inset: 0; background: #3a3d47; border-radius: 24px;
        cursor: pointer; transition: .15s; }
      .slider::before { content: ""; position: absolute; height: 18px; width: 18px; left: 3px;
        bottom: 3px; background: #fff; border-radius: 50%; transition: .15s; }
      input:checked + .slider { background: #4ade80; }
      input:checked + .slider::before { transform: translateX(18px); }
      .hint { margin-top: 12px; font-size: 10px; opacity: .5; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>WarEra Damage lines</h1>
      <p>Real-time damage-flow lines for the battle you have open.</p>
      <div class="row">
        <span>Show overlay</span>
        <label class="switch">
          <input type="checkbox" id="toggle" checked />
          <span class="slider"></span>
        </label>
      </div>
      <div class="hint">Open a battle on app.warera.io to see the lines.</div>
    </div>
    <script src="menu.js"></script>
  </body>
</html>
